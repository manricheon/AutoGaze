benchmark:
  preset_id: canonical_a1_medium
  experiment: A1_real
  scale_tier: medium
  status: config_template_only_not_paper_reproduction
  modes:
    - autogaze_only
    - full_pipeline

  # Medium increases spatial scale only. It follows the QUICK_START.md
  # high-resolution adaptation example: 392x392 is divisible by patch size 14,
  # with target scales 56, 112, 196, and 392.
  batch_size: 1
  num_frames: 16
  resolution: 392
  scale_resolution: quick_start_target_scales
  scaling_mode: resize
  temporal_chunk_size: 16
  spatial_tile_size: 392
  target_scales:
    - 56
    - 112
    - 196
    - 392
  target_patch_size: 14
  token_budget: null
  query_text: "What is happening in this video?"
  max_new_tokens: 1
  warmup_iterations: 1
  benchmark_iterations: 5
  construction_level: 3
  device: cpu
  dtype: float32
  allow_mllm_load: false
  auto_download_datasets: false
  dataset_source: dummy_or_explicit_local_video_only
  output_dir: outputs/canonical_benchmarks/A1_real/medium
  warning: "canonical medium benchmark template only; not a paper reproduction result"

  quick_start_alignment:
    default_frame_count: 16
    default_resolution: 224
    medium_resolution: 392
    medium_target_scales:
      - 56
      - 112
      - 196
      - 392
    medium_target_patch_size: 14
    scaling_behavior: quick_start_target_scales
    any_duration_chunking: utility_supported_not_used_by_this_resize_preset
    any_resolution_chunking: utility_supported_not_used_by_this_resize_preset

  safety_limits:
    max_default_frames: 16
    max_default_resolution: 392
    max_default_batch_size: 1
    max_default_new_tokens: 1
    requires_explicit_mllm_load: true
    no_4k_default: true
    no_1k_frame_default: true

  output_tables:
    latency:
      enabled: true
      columns:
        - experiment_id
        - mode
        - end_to_end_latency_ms
        - autogaze_latency_ms
        - vit_latency_ms
        - mllm_prefill_latency_ms
        - mllm_decode_latency_ms
    vram:
      enabled: true
      columns:
        - experiment_id
        - mode
        - device
        - dtype
        - peak_vram_mb
    token_reduction:
      enabled: true
      columns:
        - experiment_id
        - mode
        - visual_token_count_before_autogaze
        - visual_token_count_after_autogaze
        - token_reduction_ratio
        - selected_patches_per_frame
        - selected_patches_per_scale
    throughput:
      enabled: true
      columns:
        - experiment_id
        - mode
        - batch_size
        - num_frames
        - throughput_videos_per_sec
        - fps
    stage_level_timing:
      enabled: true
      columns:
        - experiment_id
        - mode
        - stage
        - status
        - latency_ms
    skipped_stages:
      enabled: true
      columns:
        - experiment_id
        - mode
        - stage
        - reason
