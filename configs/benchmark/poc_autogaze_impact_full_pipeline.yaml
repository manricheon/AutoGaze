benchmark:
  preset_id: poc_autogaze_impact_full_pipeline
  status: poc_a1_a2_comparison_plan
  script: scripts/benchmark_poc_autogaze_impact.py
  execution_engine: scripts/poc_nvila_hd_video.py
  mode: full_pipeline
  experiments:
    baseline: configs/experiment/A1_real.yaml
    autogaze: configs/experiment/A2_real.yaml
  comparison:
    baseline_id: A1_real
    autogaze_id: A2_real
    purpose: isolate_autogaze_impact_with_modified_siglip_and_nvila_held_constant
    required_matching_axes:
      - input video
      - frame_selection_mode
      - num_frames
      - scaling_mode
      - resolution
      - device
      - dtype
      - max_new_tokens
      - query_text
  input_source: dummy
  query_text: "Question: What is happening in this video? Please answer directly."
  frame_selection_mode: sample
  num_frames: 16
  scaling_mode: resize
  resolution: 224
  device: cpu
  dtype: float32
  max_new_tokens: 1
  repetitions: 1
  allow_checkpoint_load: false
  checkpoint_loading: disabled_by_default
  include_visualization: false
  gaze_ratio: 0.75
  task_loss_requirement: 0.7
  metrics:
    compare:
      - original_visual_token_count
      - selected_visual_token_count
      - token_reduction_ratio
      - autogaze_latency_ms
      - vision_encoder_latency_ms
      - mllm_decode_latency_ms
      - end_to_end_latency_ms
      - peak_vram_mb
      - skipped_stages
  output_dir: outputs/poc_autogaze_impact
  heavy_benchmark: false
  run_by_default: false
  result_label: poc_a1_a2_autogaze_impact_summary
  warnings:
    - "Dry-run by default; pass --execute and --allow-checkpoint-load to run real guarded PoC commands."
    - "Do not claim encoder-side acceleration unless A2 reduces tokens before the intended encoder compute stage."
    - "MPS and CPU memory metrics may be recorded as N/A."
