benchmark:
  preset_id: poc_full_length_video_export_smoke
  status: config_only_full_length_visualization_smoke
  script: scripts/poc_nvila_hd_video.py
  config: configs/experiment/A2_real.yaml
  full_pipeline_plugin_mode: experiment_config
  component_plugins:
    status: config_driven_guarded
    applies_to_modes:
      - full_pipeline
    autogaze:
      config_section: model.autogaze
      module_path_field: module_path
      class_or_factory_field: class_or_factory
      checkpoint_field: checkpoint
      construction_kwargs_field: construction_kwargs
      runtime_options:
        - gaze_ratio
        - task_loss_requirement
    vision_encoder:
      enabled_in_full_pipeline: true
      config_section: model.vision_encoder
      module_path_field: module_path
      class_or_factory_field: class_or_factory
      checkpoint_field: checkpoint
      processor_path_field: processor_path
      construction_kwargs_field: construction_kwargs
      input_contract: "[B,T,C,H,W] with optional gazing_info"
      output_contract: "tensor, last_hidden_state, visual_features, or first tuple tensor"
    mllm:
      enabled_in_full_pipeline: true
      config_section: model.mllm
      module_path_field: module_path
      class_or_factory_field: class_or_factory
      checkpoint_field: checkpoint
      processor_module_path_field: nvila_hd_video_processor_module_path
      processor_class_field: nvila_hd_video_processor_class_name
      processor_path_field: processor_path
      tokenizer_path_field: tokenizer_path
      prompt_template_field: prompt_template
      generation_method: generate
      official_processor_path: true
    limitations:
      - module/class/checkpoint overrides are config-driven, not CLI flags
      - direct visual token injection is not claimed
      - unsupported plugins must report skipped stages or failures
  mode: autogaze_only
  input_source: dummy
  frame_selection_mode: sample
  num_frames: 2
  batch_size: 1
  scaling_mode: resize
  resolution: 224
  chop_size: null
  chop_overlap: 0
  max_chops: 1
  chop_merge_mode: metadata_only
  gaze_ratio: 0.75
  task_loss_requirement: 0.7
  save_overlay_video: true
  save_side_by_side_video: true
  save_scale_panel_video: false
  video_export_mode: full_length
  benchmark_iterations: 1
  warmup_iterations: 0
  max_new_tokens: 1
  heavy_benchmark: false
  run_by_default: false
  safety_note: "Tests full-length video export only with dummy/tiny input."
  output_dir: outputs/poc_full_length_video_export_smoke
