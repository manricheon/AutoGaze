defaults:
  - model/autogaze: real
  - model/vision_encoder: vanilla_siglip_real
  - model/mllm: nvila_real
  - model/task_decoder: default
  - model/adapter: default
  - model/huggingface: default
  - task/video_vqa: default
  - task/action_recognition: default
  - data/dummy_video: default
  - data/huggingface: default
  - runtime/device: default
  - runtime/precision: default
  - runtime/seed: default
  - runtime/huggingface: default
  - benchmark/profiling: default
  - benchmark/visualizer: default
  - benchmark/huggingface: default
  - _self_

experiment:
  id: A3_real
  description: Real-path feasibility config for AutoGaze ON + vanilla SigLIP ViT + NVILA
  integration_mode: experimental_autogaze_vanilla_siglip_real_feasibility
  compatibility_status: experimental_compatibility_ablation_not_validated

task:
  type: video_vqa

inference:
  status: feasibility_check_only_no_inference
  quick_start_reference_path: QUICK_START.md
  usage_type: autogaze_plus_vanilla_siglip_experimental_feasibility
  inference_script_path: scripts/check_vanilla_siglip_feasibility.py
  checkpoint_root: weights
  model_config_path: weights/siglip2-base-patch16-224
  input_resolution: 224
  max_resolution: null
  scale_resolution: null
  target_scales: null
  target_patch_size: null
  frame_count: 16
  query_text: null
  output_dir: outputs/A3_real
  visualization_dir: outputs/A3_real/visualizations/full_pipeline
  original_cli_args:
    quick_start_has_shell_command: false
    quick_start_has_query_text: false
    quick_start_has_full_pipeline_nvila_command: false
    vanilla_siglip_gazing_info_supported: false
    a3_integration_modes:
      - input_level_crop_region_reconstruction
      - post_patch_embedding_token_masking
      - compact_token_gathering
