defaults:
  - model/huggingface: default
  - data/huggingface: default
  - runtime/device: default
  - runtime/precision: default
  - runtime/huggingface: default
  - benchmark/huggingface: default
  - _self_

experiment:
  id: hf_model_and_dataset_smoke

benchmark:
  huggingface:
    enabled: true
    mode: hf_model_and_dataset
    integration_mode: official_processor
    dry_run: true

model:
  huggingface:
    enabled: true
    model_id: null

data:
  huggingface:
    enabled: true
    dataset_id: null
    max_samples: 2
