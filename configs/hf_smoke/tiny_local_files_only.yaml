defaults:
  - model/huggingface: default
  - data/huggingface: default
  - runtime/device: default
  - runtime/precision: default
  - runtime/huggingface: default
  - _self_

experiment:
  id: hf_tiny_local_files_only_smoke

model:
  huggingface:
    enabled: true
    model_id: hf-internal-testing/tiny-random-CLIPModel
    revision: main
    trust_remote_code: false
    token_env_var: HF_TOKEN
    cache_dir: null
    local_files_only: true
    offline: true
    model_class: AutoModel

data:
  huggingface:
    enabled: true
    dataset_id: tests/fixtures/hf_dummy_dataset.jsonl
    dataset_config: null
    dataset_split: train
    revision: null
    token_env_var: HF_TOKEN
    cache_dir: null
    local_files_only: true
    offline: true
    streaming: false
    max_samples: 2
    num_proc: 1
    field_mapping:
      video: video_path
      question: question
      answer: answer
      label: label

runtime:
  huggingface:
    enabled: true
    mode: offline_hf_cache
    cache_dir: null
    local_files_only: true
    offline: true
    token_env_var: HF_TOKEN
