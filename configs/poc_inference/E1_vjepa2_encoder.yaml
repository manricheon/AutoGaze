experiment:
  id: E1
  description: V-JEPA2 video encoder extension stub

autogaze:
  enabled: false
  checkpoint_path: null
  processor_path: null
  gaze_ratio: 1.0
  task_loss_requirement: null

vision_encoder:
  name: vjepa2
  model_id: null
  checkpoint_path: null
  config_path: null
  processor_path: null
  processor_module_path: transformers
  processor_class_name: AutoProcessor
  module_path: transformers
  class_name: AutoModel
  patch_size: 16
  resolution: 224
  output_dim: 1024
  integration_mode: official_full_frame_encoder_first
  required_for_full_pipeline: true
  trust_remote_code: false
  local_files_only: true

mllm:
  name: generic_mllm
  model_id: null
  checkpoint_path: null
  config_path: null
  processor_path: null
  tokenizer_path: null
  module_path: null
  class_name: null
  trust_remote_code: false
  local_files_only: true

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize
  resolution: 224
  patch_size: 16
  chop_size: 224
  chop_overlap: 0
  max_chops: null
  chop_merge_mode: metadata_only

runtime:
  device: cpu
  dtype: float32
  allow_real_model_loading: false

generation:
  max_new_tokens: 32

visualization:
  overlay_style: mask
  overlay_alpha: 0.35
  multi_scale_overlay: true
  show_patch_index: false
  show_scale_label: false
  metadata_placement: outside
  info_panel_position: bottom
  save_overlay_video: false
  save_side_by_side_video: false
  save_scale_panel_video: false
  video_export_mode: sampled_only
  video_fps: 4.0

output:
  output_dir: outputs/poc_inference/E1
