experiment:
  id: E3
  description: V-JEPA2 + Qwen extension with input-level AutoGaze selection

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  module_path: autogaze.models.autogaze
  class_name: AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7
  compatibility_mode: input_level_region_or_frame_selection

vision_encoder:
  name: vjepa2
  model_id: null
  checkpoint_path: weights/vjepa2-vitl-fpc64-256
  config_path: null
  processor_path: weights/vjepa2-vitl-fpc64-256
  processor_module_path: transformers
  processor_class_name: AutoProcessor
  module_path: transformers
  class_name: AutoModel
  patch_size: 16
  resolution: 256
  output_dim: 1024
  integration_mode: official_full_frame_encoder_first
  required_for_full_pipeline: true
  trust_remote_code: false
  local_files_only: true
  processor_from_pretrained_kwargs:
    use_fast: false

mllm:
  name: qwen
  model_id: null
  checkpoint_path: weights/Qwen2.5-VL-7B-Instruct
  config_path: null
  processor_path: weights/Qwen2.5-VL-7B-Instruct
  tokenizer_path: weights/Qwen2.5-VL-7B-Instruct
  module_path: transformers
  class_name: AutoModelForVision2Seq
  processor_module_path: transformers
  processor_class_name: AutoProcessor
  official_processor_path: true
  official_processor_owns_vision: false
  video_input_source: processed_tensor
  direct_visual_token_injection: unsupported
  prompt_template: "Question: {prompt}"
  trust_remote_code: true
  local_files_only: true
  processor_from_pretrained_kwargs:
    use_fast: false

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize
  resolution: 224
  patch_size: 16
  chop_size: 224
  chop_overlap: 0
  max_chops: null
  chop_merge_mode: metadata_only
  resize_before_chop_threshold: 1024
  resize_before_chop_factor: 0.5

runtime:
  device: cpu
  dtype: float32
  mllm_dtype: float32
  allow_real_model_loading: false
  warmup_runs: 1
  progress: true

generation:
  max_new_tokens: 32

visualization:
  overlay_style: mask
  overlay_alpha: 0.35
  multi_scale_overlay: true
  show_patch_index: false
  show_scale_label: false
  metadata_placement: outside
  info_panel_position: bottom
  save_frame_images: false
  save_overlay_video: false
  save_side_by_side_video: false
  save_scale_panel_video: false
  video_export_mode: sampled_only
  video_fps: 4.0

output:
  output_dir: outputs/poc_inference/E3
