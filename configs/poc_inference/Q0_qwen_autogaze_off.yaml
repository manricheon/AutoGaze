experiment:
  id: Q0
  description: Qwen2.5-VL official processor baseline with AutoGaze disabled

autogaze:
  enabled: false
  checkpoint_path: null
  processor_path: null
  gaze_ratio: 1.0
  task_loss_requirement: null

vision_encoder:
  name: generic_vit
  model_id: null
  checkpoint_path: null
  config_path: null
  processor_path: null
  module_path: null
  class_name: null
  patch_size: 16
  resolution: 224
  output_dim: 768
  required_for_full_pipeline: false

mllm:
  name: qwen
  model_id: null
  checkpoint_path: weights/Qwen2.5-VL-7B-Instruct
  config_path: null
  processor_path: weights/Qwen2.5-VL-7B-Instruct
  tokenizer_path: weights/Qwen2.5-VL-7B-Instruct
  module_path: transformers
  class_name: AutoModelForVision2Seq
  processor_module_path: transformers
  processor_class_name: AutoProcessor
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: official_processor
  autogaze_integration: none
  direct_visual_token_injection: unsupported
  prompt_template: "Question: {prompt}"
  trust_remote_code: true
  local_files_only: true
  processor_from_pretrained_kwargs:
    use_fast: false

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize
  resolution: 224
  patch_size: 16
  chop_size: 224
  chop_overlap: 0
  max_chops: null
  chop_merge_mode: metadata_only
  resize_before_chop_threshold: 1024
  resize_before_chop_factor: 0.5

runtime:
  device: cpu
  dtype: float32
  mllm_dtype: float32
  allow_real_model_loading: false
  warmup_runs: 1
  progress: true

generation:
  max_new_tokens: 32

visualization:
  overlay_style: mask
  overlay_alpha: 0.35
  multi_scale_overlay: true
  show_patch_index: false
  show_scale_label: false
  metadata_placement: outside
  info_panel_position: bottom
  save_frame_images: false
  save_overlay_video: false
  save_side_by_side_video: false
  save_scale_panel_video: false
  video_export_mode: sampled_only
  video_fps: 4.0

output:
  output_dir: outputs/poc_inference/Q0
