experiment:
  id: external_apollo_candidate
  description: Apollo hybrid-vision adapter plan; use AutoGaze for input-level selection until hybrid tower mapping is solved

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7

vision_encoder:
  name: generic_vit
  required_for_full_pipeline: false
  external_vision_encoder_type: hybrid SigLIP SO400M plus InternVideo2

mllm:
  name: apollo
  model_id: GoodiesHere/Apollo-LMMs-Apollo-7B-t32
  checkpoint_path: null
  processor_path: null
  mllm_type: Qwen2-7B
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: autogaze_chop_selection
  vision_encoder_type: hybrid_siglip_internvideo2
  direct_visual_token_injection_supported: false
  positional_encoding_compatibility_status: blocked_for_direct_sparse
  token_mapping_status: post_encoder_or_input_selection_only
  status: stub-only

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize_then_chop
  resolution: 384
  patch_size: 14
  chop_size: 384
  chop_overlap: 0
  max_chops: 4

runtime:
  device: cpu
  dtype: float32
  allow_real_model_loading: false

generation:
  max_new_tokens: 32

output:
  output_dir: outputs/poc_inference/external/apollo_candidate

