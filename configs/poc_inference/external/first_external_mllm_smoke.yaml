experiment:
  id: first_external_mllm_smoke
  description: First external Table-model MLLM smoke scaffold using Qwen2.5-VL official processor with AutoGaze input-level frame selection

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7
  integration_role: input_level_frame_selection_only

vision_encoder:
  name: generic_vit
  required_for_full_pipeline: false
  external_vision_encoder_type: qwen2_5_vl_official_processor_owned
  fallback_adapter: null

mllm:
  name: qwen2_5_vl
  model_id: weights/Qwen2.5-VL-7B-Instruct
  checkpoint_path: weights/Qwen2.5-VL-7B-Instruct
  processor_path: weights/Qwen2.5-VL-7B-Instruct
  tokenizer_path: weights/Qwen2.5-VL-7B-Instruct
  mllm_type: Qwen2.5-7B
  module_path: transformers
  class_name: AutoModelForVision2Seq
  processor_module_path: transformers
  processor_class_name: AutoProcessor
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: autogaze_frame_selection
  video_input_source: processed_tensor
  vision_encoder_type: Qwen2.5-VL native dynamic-resolution ViT
  direct_visual_token_injection_supported: false
  positional_encoding_compatibility_status: blocked_for_direct_injection_mrope_grid_thw_required
  token_mapping_status: input_selection_only
  local_files_only: true
  trust_remote_code: true
  status: stub-only

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize
  resolution: 224
  patch_size: 14
  chop_size: 224
  chop_overlap: 0
  max_chops: null
  zero_mask:
    enabled: false

runtime:
  device: cpu
  dtype: float32
  mllm_dtype: float32
  allow_real_model_loading: false
  warmup_runs: 1
  progress: true

generation:
  query_text: Describe the main action in the video.
  max_new_tokens: 32

visualization:
  overlay_style: mask
  overlay_alpha: 0.35
  multi_scale_overlay: true
  save_frame_images: false
  save_overlay_video: false
  save_side_by_side_video: false
  save_scale_panel_video: false

output:
  output_dir: outputs/poc_inference/external/first_external_mllm_smoke
  status: stub-only
