experiment:
  id: external_qwen2_5_vl_input_selection
  description: Qwen2.5-VL input-selection-only plan; direct selected-token injection remains disabled

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7

vision_encoder:
  name: generic_vit
  required_for_full_pipeline: false
  external_vision_encoder_type: Qwen2.5 native dynamic-resolution ViT

mllm:
  name: qwen2_5_vl
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  checkpoint_path: null
  processor_path: null
  mllm_type: Qwen2.5-7B
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: autogaze_frame_selection
  vision_encoder_type: Qwen2.5-VL native ViT
  direct_visual_token_injection_supported: false
  positional_encoding_compatibility_status: blocked_for_direct_injection_mrope_grid_thw_required
  token_mapping_status: input_selection_only
  status: stub-only

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize
  resolution: 224
  patch_size: 14
  chop_size: 224
  chop_overlap: 0
  max_chops: null

runtime:
  device: cpu
  dtype: float32
  allow_real_model_loading: false

generation:
  max_new_tokens: 32

output:
  output_dir: outputs/poc_inference/external/qwen2_5_vl_input_selection
