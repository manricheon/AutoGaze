experiment:
  id: smoke_apollo
  description: Apollo smoke scaffold; official processor with AutoGaze input-level chop selection

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7
  integration_role: input_selection_only

vision_encoder:
  name: generic_vit
  required_for_full_pipeline: false
  external_vision_encoder_type: apollo_official_processor_owned
  fallback_adapter: null

mllm:
  name: apollo
  model_id: GoodiesHere/Apollo-LMMs-Apollo-7B-t32
  checkpoint_path: weights/apollo
  processor_path: weights/apollo
  tokenizer_path: weights/apollo
  adapter: ApolloAdapter
  mllm_type: Qwen2-7B
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: autogaze_chop_selection
  vision_encoder_type: Hybrid SigLIP plus InternVideo2 with Perceiver connector
  direct_visual_token_injection_supported: false
  positional_encoding_compatibility_status: blocked_for_direct_sparse_hybrid_resampler
  token_mapping_status: input_selection_only
  local_files_only: true
  trust_remote_code: true
  status: blocked_missing_assets

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: chop
  resolution: 448
  patch_size: 14
  chop_size: 448
  chop_overlap: 64
  max_chops: 8
  zero_mask:
    enabled: false
    mode: image_space_only

runtime:
  device: cpu
  dtype: float32
  mllm_dtype: float32
  local_files_only: true
  allow_real_model_loading: false
  warmup_runs: 1
  progress: true

generation:
  query_text: Describe the main action in the video.
  max_new_tokens: 32

output:
  output_dir: outputs/poc_inference/external/smoke_apollo
  status: blocked_missing_assets
