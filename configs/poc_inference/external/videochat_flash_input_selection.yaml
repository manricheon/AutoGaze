experiment:
  id: external_videochat_flash_input_selection
  description: VideoChat-Flash input-selection-only plan through official processor/chat path

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7

vision_encoder:
  name: generic_vit
  required_for_full_pipeline: false
  external_vision_encoder_type: UMT-L or UMT-HD-L

mllm:
  name: videochat_flash
  model_id: OpenGVLab/VideoChat-Flash-Qwen2-7B_res448
  checkpoint_path: null
  processor_path: null
  mllm_type: Qwen2-7B
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: autogaze_frame_selection
  vision_encoder_type: UMT
  direct_visual_token_injection_supported: false
  positional_encoding_compatibility_status: blocked_for_direct_sparse
  token_mapping_status: input_selection_only
  status: stub-only

frame_selection:
  mode: sample
  num_frames: 16
  frame_interval: 1
  max_windows: 1

scaling:
  mode: resize
  resolution: 448
  patch_size: 14
  chop_size: 448
  chop_overlap: 0
  max_chops: null

runtime:
  device: cpu
  dtype: float32
  allow_real_model_loading: false

generation:
  max_new_tokens: 32

output:
  output_dir: outputs/poc_inference/external/videochat_flash_input_selection

