experiment:
  id: external_vjepa2_autogaze_chop_selection
  description: AutoGaze crop/chop selection feeding dense selected clips to V-JEPA2

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7

vision_encoder:
  name: vjepa2
  model_id: weights/vjepa2-vitl-fpc64-256
  checkpoint_path: weights/vjepa2-vitl-fpc64-256
  processor_path: weights/vjepa2-vitl-fpc64-256
  model_type: video_encoder
  integration_mode: autogaze_chop_selection_vjepa2
  decoder_type: frozen_feature_extraction
  patch_size: 16
  crop_size: 256
  frames_per_clip: 64
  tubelet_size: 2
  positional_encoding_status: dense_positions_preserved_inside_each_selected_chop
  status: stub-only

frame_selection:
  mode: sample
  num_frames: 64
  max_windows: 1

scaling:
  mode: chop
  resolution: 256
  patch_size: 16
  chop_size: 256
  chop_overlap: 32
  max_chops: 4

zero_mask:
  enabled: false

mllm:
  target: none
  compatibility_status: not_applicable
  training_required: false

runtime:
  device: cpu
  dtype: float32
  allow_real_model_loading: false

output:
  output_dir: outputs/poc_inference/external/vjepa2_autogaze_chop_selection
