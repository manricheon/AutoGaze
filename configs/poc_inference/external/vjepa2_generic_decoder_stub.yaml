experiment:
  id: external_vjepa2_generic_decoder_stub
  description: Generic frozen-decoder placeholder for V-JEPA2 feature probes; no trainable adapter included

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze

vision_encoder:
  name: vjepa2
  model_id: weights/vjepa2-vitl-fpc64-256
  checkpoint_path: weights/vjepa2-vitl-fpc64-256
  processor_path: weights/vjepa2-vitl-fpc64-256
  model_type: video_encoder
  integration_mode: vjepa2_feature_extraction
  decoder_type: generic_frozen_decoder_stub
  patch_size: 16
  crop_size: 256
  frames_per_clip: 64
  tubelet_size: 2
  positional_encoding_status: dense_official_features_only
  status: future work

frame_selection:
  mode: sample
  num_frames: 64

scaling:
  mode: resize
  resolution: 256
  patch_size: 16

zero_mask:
  enabled: false

mllm:
  target: generic_mllm
  compatibility_status: blocked_without_verified_frozen_projector
  training_required: true_or_unknown

runtime:
  device: cpu
  dtype: float32
  allow_real_model_loading: false

output:
  output_dir: outputs/poc_inference/external/vjepa2_generic_decoder_stub
