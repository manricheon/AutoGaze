experiment:
  id: HLVid_NVILA_HD_SUBSET_AUTOGAZE_OFF
  description: Bounded HLVid subset config with NVILA-HD official processor and AutoGaze pruning disabled.

evaluation:
  autogaze_mode: "off"

dataset:
  name: bfshi/HLVid
  split: null
  path: null
  video_root: null
  start_index: 0
  max_samples: 20
  prompt_format: hlvid_mcq
  fields:
    question_id: question_id
    video_path: video_path
    question: question
    answer: answer

model:
  name: nvila
  model_path: weights/NVILA-8B-HD-Video
  processor_path: weights/NVILA-8B-HD-Video
  trust_remote_code: true
  local_files_only: true
  from_pretrained_kwargs:
    device_map: auto
    max_batch_size_siglip: 32
  processor_from_pretrained_kwargs:
    use_fast: false
    autogaze_model_id: weights/AutoGaze
    num_video_frames: 128
    num_video_frames_thumbnail: 64
    max_tiles_video: 48
    gazing_ratio_tile: null
    task_loss_requirement_tile: null
    gazing_ratio_thumbnail: null
    task_loss_requirement_thumbnail: null
    max_batch_size_autogaze: 16

runtime:
  allow_real_model_loading: false
  local_files_only: true
  device_map: auto
  dtype: null

generation:
  max_new_tokens: 4

output:
  output_dir: outputs/hlvid_nvila_hd_subset_autogaze_off
