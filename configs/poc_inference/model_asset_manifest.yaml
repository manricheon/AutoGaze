manifest_version: 1
description: External MLLM and V-JEPA2 asset manifest for staged dry-run, download, verification, and config inspection.
default_output_root: weights
local_directory_convention: >
  Use repository-local weights/ directories. Existing local checkpoints keep their actual folder names;
  missing external candidates use weights/<model_key>.
tiers:
  tier1:
    description: Highest-priority external MLLM candidates; VILA/LLaVA/SigLIP-related.
    models:
      - longvila_r1
      - longva
      - llava_ov
      - videollama3
      - apollo
  tier1b:
    description: V-JEPA2 as a separate video encoder/decoder branch.
    models:
      - vjepa2
  tier2:
    description: Input-selection-first candidates; do not download by default unless explicitly selected.
    models:
      - qwen2_5_vl
      - internvl3_5
      - videochat_flash

models:
  llava_ov:
    tier: tier1
    priority_rank: 3
    canonical_model_name: LLaVA-OV / LLaVA-OneVision 8B
    candidate_model_id: llava-hf/llava-onevision-qwen2-7b-ov-hf
    official_repo_url: https://github.com/LLaVA-VL/LLaVA-NeXT
    model_card_url: https://huggingface.co/llava-hf/llava-onevision-qwen2-7b-ov-hf
    paper_report_url: https://arxiv.org/abs/2408.03326
    expected_checkpoint_size_gb: unknown
    gated_private_status: unknown
    required_token_env_var: HF_TOKEN
    local_target_directory: weights/llava_ov
    expected_config_files:
      - config.json
    expected_processor_tokenizer_files:
      - preprocessor_config.json
      - tokenizer_config.json
    expected_weight_files: []
    expected_vision_encoder_type: SigLIP patch14 any-resolution/video pipeline
    expected_mllm_type: Qwen2-7B
    expected_adapter_name: llava_ov
    smoke_config: configs/poc_inference/external/smoke_llava_ov.yaml
    recommended_integration_modes:
      - official_processor
      - autogaze_frame_selection
      - autogaze_chop_selection
      - autogaze_zero_mask
    direct_visual_token_injection_supported: false
    download_status: not_checked
    smoke_test_status: not_tested

