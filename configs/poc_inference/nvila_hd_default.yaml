experiment:
  id: NVILA_HD_DEFAULT
  description: README-like NVILA-HD-Video processor preset for high-resolution video inference.

nvila_hd:
  preset: default
  num_video_frames: 128
  num_video_frames_thumbnail: 64
  max_tiles_video: 48
  gazing_ratio_tile: [0.2, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06]
  task_loss_requirement_tile: 0.6
  gazing_ratio_thumbnail: 1.0
  task_loss_requirement_thumbnail: null
  max_batch_size_autogaze: 16
  max_batch_size_siglip: 32

autogaze:
  enabled: true
  checkpoint_path: weights/AutoGaze
  processor_path: weights/AutoGaze
  module_path: autogaze.models.autogaze
  class_name: AutoGaze
  gaze_ratio: 0.75
  task_loss_requirement: 0.7
  strict_params: false

vision_encoder:
  name: modified_siglip
  checkpoint_path: weights/siglip2-base-patch16-224
  processor_path: weights/siglip2-base-patch16-224
  module_path: autogaze.vision_encoders.siglip.modeling_siglip
  class_name: SiglipVisionModel
  patch_size: 16
  resolution: 224
  output_dim: 768
  local_files_only: true
  required_for_full_pipeline: false
  from_pretrained_kwargs:
    scales: 32+64+112+224
    attn_implementation: sdpa

mllm:
  name: nvila
  checkpoint_path: weights/NVILA-8B-HD-Video
  processor_path: weights/NVILA-8B-HD-Video
  tokenizer_path: weights/NVILA-8B-HD-Video
  module_path: transformers
  class_name: AutoModel
  processor_module_path: transformers
  processor_class_name: AutoProcessor
  official_processor_path: true
  official_processor_owns_vision: true
  generation_input_mode: official_processor
  video_input_source: source_video
  sync_autogaze_controls_from_config: true
  prompt_template: "{video_token}\n\n{prompt}"
  trust_remote_code: true
  local_files_only: true
  from_pretrained_kwargs:
    device_map: auto
    max_batch_size_siglip: 32
  processor_from_pretrained_kwargs:
    use_fast: false
    autogaze_model_id: weights/AutoGaze
    num_video_frames: 128
    num_video_frames_thumbnail: 64
    max_tiles_video: 48
    gazing_ratio_tile: [0.2, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06, 0.06]
    task_loss_requirement_tile: 0.6
    gazing_ratio_thumbnail: 1.0
    task_loss_requirement_thumbnail: null
    max_batch_size_autogaze: 16

frame_selection:
  mode: sample
  num_frames: 128
  frame_interval: 1
  max_windows: 1

video_input:
  read_mode: full
  decode_backend: auto
  decode_fps: null
  max_decode_frames: null
  resize_before_buffer: true

streaming:
  enabled: false
  window_size: 128
  overlap: 0
  max_windows: 1
  output_mode: incremental
  full_pipeline_policy: first_window_only
  flush_every_window: true
  cpu_offload_between_windows: true
  empty_cache_between_windows: false
  keep_window_outputs_in_memory: false

memory:
  safe_mode: true
  max_video_frames_in_memory: 128
  max_pixels_per_window: null
  max_processed_frames_per_window: 128
  max_processed_pixels_per_window: 6422528
  fail_on_full_video_load: true

scaling:
  mode: resize
  resolution: 224
  patch_size: 16
  chop_size: 224
  chop_overlap: 0
  max_chops: null
  chop_merge_mode: metadata_only
  resize_before_chop_threshold: 1024
  resize_before_chop_factor: 0.5

runtime:
  device: auto
  dtype: float16
  mllm_dtype: float16
  allow_real_model_loading: false
  warmup_runs: 0
  progress: true

generation:
  max_new_tokens: 32

visualization:
  overlay_style: mask
  overlay_alpha: 0.35
  multi_scale_overlay: true
  show_patch_index: false
  show_scale_label: false
  metadata_placement: outside
  info_panel_position: bottom
  save_frame_images: false
  save_overlay_video: false
  save_side_by_side_video: false
  save_scale_panel_video: false
  video_export_mode: sampled_only
  video_fps: 4.0

output:
  output_dir: outputs/poc_inference/nvila_hd_default
