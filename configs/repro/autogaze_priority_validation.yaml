description: >
  Priority validation matrix before broader plugin generalization. The order is:
  NVILA-HD AutoGaze profiling, NVILA-8B-Video baseline on/off, LongVILA
  AutoGaze sidecar checks, Qwen2.5/Qwen3 AutoGaze sparse PoC, and LLaVA post-encoder prune smoke.

priority_tracks:
  - name: nvila_hd_autogaze_profile
    objective: >
      Re-validate the native NVILA-HD AutoGaze path with latency, memory, token,
      and HLVid accuracy reports.
    runner:
      module: repro.hlvid_batch_benchmark
      modes:
        - hd_keep_all_optional
        - hd_autogaze
      recommended_args:
        paper_hd_autogaze: true
        include_hd_keep_all_optional: true
        limit: 3
        num_video_frames: 1024
        num_video_frames_thumbnail: 64
        max_tiles_video: 48
    completion_gate:
      - keep-all and AutoGaze rows are both present for the same HLVid questions
      - summary includes Decode/read, Prep rest, Selector input, AutoGaze, Vision input, ViT, LLM, total latency
      - summary includes visual token and patch reduction before/after AutoGaze
      - summary includes peak memory and failure stage when OOM happens

  - name: nvila_video_baseline_autogaze_on_off
    objective: >
      Run the non-HD NVILA-8B-Video baseline/off path and an AutoGaze-on probe on
      the same input set without mixing this with the paper baseline semantics.
    runner:
      module: repro.plugin_hlvid_benchmark
      modes:
        - nvila-video-off
        - nvila-video-autogaze-actual
      recommended_args:
        limit: 3
        num_video_frames: 256
        max_tiles_video: 8
        external_mllm_command: vila-infer
    completion_gate:
      - nvila-video-off executes through official VILA CLI
      - nvila-video-autogaze-actual executes dense VILA CLI with AutoGaze sidecar metrics, or records the exact missing dependency/failure stage
      - paper baseline and plugin on/off identities are separated in report

  - name: longvila_autogaze_poc
    objective: >
      Run LongVILA native/off and AutoGaze-on probe on the same inputs to locate
      the long-video feature packing boundary.
    runner:
      module: repro.plugin_hlvid_benchmark
      modes:
        - longvila-off
        - longvila-autogaze-actual
      recommended_args:
        limit: 3
        num_video_frames: 256
        max_tiles_video: 8
        external_mllm_command: vila-infer
    completion_gate:
      - longvila-off executes through official VILA CLI
      - longvila-autogaze-actual executes dense VILA CLI with AutoGaze sidecar metrics, or records the exact missing dependency/failure stage
      - report records exact failure/dependency status if CLI/model is missing

  - name: qwen_grid_autogaze_poc
    objective: >
      Run Qwen2.5-VL and Qwen3-VL full, chunked, and chunked+AutoGaze sparse
      paths on the same input set.
    runner:
      module: repro.plugin_hlvid_benchmark
      modes:
        - qwen2.5_full_vit
        - qwen2.5_chunked_vit
        - qwen2.5_chunked_vit_autogaze_sparse
        - qwen3_full_vit
        - qwen3_chunked_vit
        - qwen3_chunked_vit_autogaze_sparse
      recommended_args:
        limit: 3
        num_video_frames: 32
        num_video_frames_thumbnail: 8
        qwen_video_nframes: 32
        qwen_thumbnail_mode: append-video
        qwen_vit_chunk_frames: 16
        qwen_vit_max_spatial_chunks: 4
        video_resize_longest_edge: 448
        max_tiles_video: 4
        max_new_tokens: 8
    completion_gate:
      - full and chunked off modes execute or record exact CUDA/dependency failure
      - AutoGaze sparse modes create SparseSelectionPlan and reduce visual_tokens_after_prune against visual_tokens_before_prune
      - Qwen2.5 and Qwen3 reports use the same token/latency/memory fields

  - name: llava_onevision_autogaze_actual
    objective: >
      Run LLaVA-OneVision dense/off and AutoGaze post-encoder visual-token
      prune-generate on the same inputs.
    runner:
      module: repro.plugin_hlvid_benchmark
      modes:
        - llava-onevision-off
        - llava-onevision-autogaze-actual
      recommended_args:
        limit: 3
        num_video_frames: 32
        num_video_frames_thumbnail: 0
        video_resize_longest_edge: 448
        max_tiles_video: 4
        max_new_tokens: 8
    completion_gate:
      - llava-onevision-off executes native dense generation or records the exact dependency failure
      - llava-onevision-autogaze-actual applies post-encoder visual-token pruning or records failed_mapping/probe_required
      - report does not claim ViT latency reduction for post-encoder pruning
