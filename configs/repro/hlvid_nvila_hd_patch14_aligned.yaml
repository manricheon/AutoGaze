name: hlvid_nvila_hd_patch14_aligned
description: >
  NVILA-HD HLVid benchmark preset for patch-size comparison. This is the
  SigLIP-aligned path: AutoGaze target patch size matches the NVILA vision
  tower patch size.

patch_space:
  purpose: alignment_compute_analysis
  note: >
    Use this as the default for token/latency/memory analysis because NVILA-HD
    SigLIP uses patch_size=14 and sparse SigLIP gathers by gazing_pos.
  tile_size: 392
  target_scales: 56+112+196+392
  autogaze_target_patch_size: 14
  siglip_patch_size: 14
  positions_per_tile_frame: 1060

nvila_runner:
  args:
    mode: hlvid
    model_path: nvidia/NVILA-8B-HD-Video
    model_family: nvila-hd-video-autogaze
    autogaze_model: nvidia/AutoGaze
    gazing_mode: autogaze
    device: cuda
    device_map: auto
    config: default
    split: test
    num_video_frames: 128
    num_video_frames_thumbnail: 64
    max_tiles_video: 8
    autogaze_target_scales: 56+112+196+392
    autogaze_target_patch_size: 14
    task_loss_requirement_tile: 0.6
    max_batch_size_autogaze: 16
    max_batch_size_siglip: 32
    measure_ttft: true
    warmup_runs: 1
    repeat_runs: 1
    resume: true
    continue_on_error: true
    predictions: outputs/autogaze_repro/patchsize_compare/hlvid_patch14_aligned_predictions.jsonl
    summary: outputs/autogaze_repro/patchsize_compare/hlvid_patch14_aligned_summary.json
    scored_predictions: outputs/autogaze_repro/patchsize_compare/hlvid_patch14_aligned_scored.jsonl

