name: llava_onevision_plugin_autogaze_post_prune
description: >
  LLaVA-OneVision AutoGaze post-encoder token prune candidate. LLaVA-OneVision
  uses SigLIP and pools videos to a fixed visual token budget per frame, so
  pre-encoder sparse is harder and post-pool pruning is the first comparison.

experiment_identity:
  model_family: llava-onevision
  token_selector: autogaze
  autogaze_applicability: experimental_plugin_requested
  autogaze_integration_level: post_encoder_token_prune

flexible_runner:
  args:
    mode: inspect
    model_path: weight/llava-onevision-qwen2-7b-ov
    model_family: llava-onevision
    token_selector_adapter: autogaze
    token_selector_path: weight/AutoGaze
    vision_encoder_adapter: llava-onevision-siglip
    mllm_adapter: llava-onevision
    autogaze_integration_level: post_encoder_token_prune
    num_video_frames: 128
    output_json: outputs/autogaze_repro/flexible_llava_onevision_autogaze_post_prune_inspect.json
