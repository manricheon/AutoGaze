name: nvila_video_plugin_autogaze_requested
description: >
  NVILA-8B-Video with an AutoGaze token selector requested as a plugin
  experiment. The current runner records this as planned_plugin until the
  non-HD model feature-packing integration is implemented.

experiment_identity:
  model_family: nvila-video-plugin
  token_selector: autogaze
  autogaze_applicability: experimental_plugin_requested
  autogaze_integration_level: planned_plugin

flexible_runner:
  args:
    mode: inspect
    model_path: weight/NVILA-8B-Video
    model_family: nvila-video-plugin
    token_selector_adapter: autogaze
    token_selector_path: weight/AutoGaze
    vision_encoder_adapter: nvila-video-vision
    mllm_adapter: nvila-video
    autogaze_integration_level: planned_plugin
    num_video_frames: 128
    output_json: outputs/autogaze_repro/flexible_nvila_video_plugin_autogaze_requested_inspect.json
