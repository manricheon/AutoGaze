description: >
  HLVid limit-3 plugin comparison wrapper for extensibility checks. This runs
  grouped Qwen2.5/Qwen3 comparison modes, VILA-family off/AutoGaze actual-entry modes,
  LLaVA-OneVision off/post-encoder-prune actual mode, and InternVL3 off/AutoGaze-sidecar
  modes on the same HLVid rows.

plugin_hlvid_benchmark:
  module: repro.plugin_hlvid_benchmark
  args:
    manifest: /path/to/HLVid/data/test-00000-of-00001.parquet
    video_root: /path/to/HLVid/videos
    output_dir: outputs/autogaze_repro/plugin_hlvid_limit3
    limit: 3
    modes:
      - nvila-video-off
      - nvila-video-autogaze-actual
      - longvila-off
      - longvila-autogaze-actual
      - internvl3-off
      - internvl3-autogaze-sidecar-generate
      - llava-onevision-off
      - llava-onevision-autogaze-actual
      - qwen2.5_full_vit
      - qwen2.5_chunked_vit
      - qwen2.5_chunked_vit_autogaze_sparse
      - qwen3_full_vit
      - qwen3_chunked_vit
      - qwen3_chunked_vit_autogaze_sparse
    external_mllm_command: vila-infer
    num_video_frames: 32
    num_video_frames_thumbnail: 8
    qwen_video_nframes: 32
    qwen_thumbnail_mode: append-video
    qwen_vit_chunk_frames: 16
    qwen_vit_max_spatial_chunks: 4
    video_resize_longest_edge: 448
    max_tiles_video: 4
    max_new_tokens: 8
    models:
      nvila-video: weight/NVILA-8B-Video
      longvila: weight/LongVILA
      internvl3: weight/InternVL3
      llava-onevision: weight/LLaVA-OneVision
      qwen2.5-vl: weight/Qwen2.5-VL-7B-Instruct
      qwen3-vl: weight/Qwen3-VL-8B-Instruct

outputs:
  predictions: outputs/autogaze_repro/plugin_hlvid_limit3/plugin_hlvid_predictions.jsonl
  summary: outputs/autogaze_repro/plugin_hlvid_limit3/plugin_hlvid_summary.json
  markdown: outputs/autogaze_repro/plugin_hlvid_limit3/plugin_hlvid_report.md
