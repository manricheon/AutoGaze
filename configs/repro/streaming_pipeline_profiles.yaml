name: streaming_pipeline_profiles
description: Recommended AutoGaze/NVILA stream-profile configurations by local MPS and CUDA target.

defaults:
  mode: stream-profile
  stream_chunk_frames: 16
  num_video_frames_thumbnail: 64
  autogaze_target_scales: 56+112+196+392
  autogaze_target_patch_size: 14
  note: >
    Use stream-profile to bound decode/tile/AutoGaze memory. Full NVILA single/hlvid
    still needs collected visual tokens for SigLIP, projector, and LLM generation.

local_mps:
  fast_448p:
    intent: Fast local path check; useful when MPS AutoGaze overhead is the bottleneck.
    args:
      device: mps
      stream_dtype: float32
      gazing_mode: autogaze
      num_video_frames: 64
      num_video_frames_thumbnail: 32
      max_tiles_video: 1
      stream_chunk_frames: 16
      max_batch_size_autogaze: 1
      max_batch_size_siglip: 16
      video_resize_shortest_edge: 448
  balanced_720p:
    intent: Highest local MPS setting that still looks practical for short probes.
    args:
      device: mps
      stream_dtype: float32
      gazing_mode: autogaze
      num_video_frames: 16
      num_video_frames_thumbnail: 8
      max_tiles_video: 4
      stream_chunk_frames: 16
      max_batch_size_autogaze: 1
      max_batch_size_siglip: 16
      video_resize_shortest_edge: 720
  avoid_on_mps:
    reason: >
      1080p/8-tile and larger settings are functional but slow on local MPS.
      Use them only as smoke tests; run optimization claims on CUDA.

cuda:
  fast_720p:
    intent: Latency-first CUDA starting point for short demos and sanity checks.
    args:
      device: cuda
      stream_dtype: float16
      gazing_mode: autogaze
      num_video_frames: 128
      num_video_frames_thumbnail: 64
      max_tiles_video: 4
      stream_chunk_frames: 16
      max_batch_size_autogaze: 16
      max_batch_size_siglip: 32
      video_resize_shortest_edge: 720
  latency_4k:
    intent: First 4K HLVid setting to try when full NVILA latency is worse than expected.
    args:
      device: cuda
      stream_dtype: float16
      gazing_mode: autogaze
      num_video_frames: 128
      num_video_frames_thumbnail: 64
      max_tiles_video: 8
      stream_chunk_frames: 16
      max_batch_size_autogaze: 16
      max_batch_size_siglip: 32
      video_resize_shortest_edge: 1080
  quality_4k:
    intent: Balanced quality/latency setting for 4K after latency_4k passes.
    args:
      device: cuda
      stream_dtype: float16
      gazing_mode: autogaze
      num_video_frames: 128
      num_video_frames_thumbnail: 64
      max_tiles_video: 16
      stream_chunk_frames: 16
      max_batch_size_autogaze: 16
      max_batch_size_siglip: 32
      video_resize_shortest_edge: 1440
  paper_probe_4k_256f:
    intent: Paper-facing probe before attempting 1024 sampled frames.
    args:
      device: cuda
      stream_dtype: float16
      gazing_mode: autogaze
      num_video_frames: 256
      num_video_frames_thumbnail: 64
      max_tiles_video: 32
      stream_chunk_frames: 16
      max_batch_size_autogaze: 16
      max_batch_size_siglip: 32
      video_resize_shortest_edge: 1440
  paper_stress_4k_1024f:
    intent: Stress test only after lower-frame probes confirm memory and context behavior.
    args:
      device: cuda
      stream_dtype: float16
      gazing_mode: autogaze
      num_video_frames: 1024
      num_video_frames_thumbnail: 64
      max_tiles_video: 48
      stream_chunk_frames: 16
      max_batch_size_autogaze: 16
      max_batch_size_siglip: 32
      video_resize_shortest_edge: null
