model:
  embed_dim: 192
  patch_size: 16
  img_size: 224
  num_frames: 16
  backbone_depth: 4       # 4–6 Mamba layers
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2

selection:
  scales: [32, 64, 112, 224]
  patch_size: 16
  # [4, 16, 49, 196] tokens per scale, total 265
  gumbel_temp_init: 1.0
  gumbel_temp_final: 0.1
  gumbel_anneal_epochs: 100
  default_gazing_ratio: 0.5   # fraction of tokens per scale to keep
  frame_budget_eps: 0.01      # skip frame if predicted recon_loss < eps

training:
  phase1:
    batch_size: 256
    lr: 5.0e-4
    weight_decay: 0.05
    epochs: 150
    warmup_epochs: 10
    grad_clip: 1.0
    focal_alpha: 0.25
    focal_gamma: 2.0
    recon_loss_weight: 0.1
  phase2_ste:
    batch_size: 128
    lr: 1.0e-4
    weight_decay: 0.01
    epochs: 30
    warmup_epochs: 3
    grad_clip: 1.0
    ste_temperature: 0.1   # fixed low temperature for straight-through

data:
  hf_dataset: bfshi/AutoGaze-Training-Data
  num_workers: 8
  pin_memory: true
  img_size: 224
  num_frames: 16

eval:
  batch_size: 64
  recon_model_path: null       # path to block-causal VideoMAE weights
  latency_runs: 200
  latency_warmup: 20

checkpoint:
  save_dir: checkpoints/
  save_every_n_epochs: 10
  keep_last_n: 5

logging:
  log_every_n_steps: 50
