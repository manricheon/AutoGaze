[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogaze"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "torch",
    "torchvision",
    "hydra-core>=1.3.2",
    "wandb",
    "loguru",
    "timm>=1.0.15",
    "tqdm",
    "transformers==5.5.0",
    "pillow",
    "numpy",
    "omegaconf",
    "matplotlib",
    "einops",
    "av",
    "imageio"
]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[project.optional-dependencies]
# NOTE: flash_attn is required ONLY by the legacy AutoGaze training path
# (attn_implementation="flash_attention_2"). Borissal v0/v1 training uses
# transformers' V-JEPA2 with sdpa and torch.hub V-JEPA2.1 -- neither needs
# flash_attn. On Linux/CUDA, plain `uv pip install -e .` is sufficient for
# Borissal work; install `.[cuda]` only to run the legacy stack.
cuda = [
    "flash_attn",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
